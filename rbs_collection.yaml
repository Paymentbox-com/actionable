# Download sources
sources:
  - type: git
    name: ruby/gem_rbs_collection
    remote: https://github.com/ruby/gem_rbs_collection.git
    revision: main
    repo_dir: gems

# You can specify local directories as sources also.
# - type: local
#   path: path/to/your/local/repository

# A directory to install the downloaded RBSs
path: .gem_rbs_collection

gems:
  # Stdlib libraries the gem requires directly (require 'date', 'bigdecimal').
  # rbs ships their sigs; list them so the collection resolves ::Date,
  # ::DateTime and ::BigDecimal during `sigs:validate`.
  - name: date
  - name: time
  - name: bigdecimal
