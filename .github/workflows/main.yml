name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  build:
    runs-on: [self-hosted, afs-ci]
    name: Ruby ${{ matrix.ruby }}
    strategy:
      # Test every version independently; one failure must not mask the rest.
      fail-fast: false
      matrix:
        # The gemspec floor (>= 3.3, the oldest Ruby a known client runs)
        # through the newest release.
        ruby:
          - '3.3'
          - '3.4'
          - '4.0'

    steps:
    - uses: actions/checkout@v4
    # p01 (Ubuntu 26.04) has no hostedtoolcache and gha-ci no sudo, so
    # setup-ruby can't run there; mise installs Ruby into the runner's
    # persistent ~/.local/share/mise, the way quantum-enclave's p01 jobs do.
    # The mise version and linux-x64 sha256 match quantum-enclave's ci.yml.
    - name: Set up Ruby (mise)
      uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      with:
        version: 2026.10.3
        sha256: 8d48bc510b7d844fad0bc7156c0855c2a1e7230c51e498a7f6b63b021f8b57c5
        cache: false
        mise_toml: |
          [tools]
          ruby = "${{ matrix.ruby }}"
    - name: Install gems
      run: bundle install --jobs 4
    - name: Install RBS collection (stdlib sigs for sigs:validate)
      run: bundle exec rbs collection install
    - name: Run the default task
      run: bundle exec rake
    - name: Type signature guards (staleness, sord allowlist, grammar)
      run: bundle exec rake sigs:check sigs:validate
    - name: Docs guard (public API documented in USAGE)
      run: bundle exec rake docs:check

  # Report-only Steep (Steep 2.x / rbs 4.x need Ruby >= 3.3, so it has its own
  # gemfile). It never fails the build and is deliberately NOT in `ci`'s needs:
  # the problem count is a trend to read, not a gate.
  types:
    runs-on: [self-hosted, afs-ci]
    name: types (report-only)
    continue-on-error: true
    env:
      BUNDLE_GEMFILE: gemfiles/types.gemfile
    steps:
    - uses: actions/checkout@v4
    # Same mise setup as the first job (see its comment).
    - name: Set up Ruby (mise)
      uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      with:
        version: 2026.10.3
        sha256: 8d48bc510b7d844fad0bc7156c0855c2a1e7230c51e498a7f6b63b021f8b57c5
        cache: false
        mise_toml: |
          [tools]
          ruby = "3.4"
    - name: Install gems
      run: bundle install --jobs 4
    - name: Install RBS collection
      run: bundle exec rbs collection install
    - name: Steep check (core + adapters, report-only)
      run: |
        bundle exec steep check | tee steep.log || true
        echo "### Steep (report-only): $(tail -n 1 steep.log)" >> "$GITHUB_STEP_SUMMARY"

  # The full suite with real ActiveJob (test adapter) and Sidekiq (inline
  # testing mode, no Redis), so spec/actionable/job_backends/ runs instead of
  # skipping as it does in `build`.
  jobs:
    runs-on: [self-hosted, afs-ci]
    name: jobs (ActiveJob + Sidekiq)
    env:
      BUNDLE_GEMFILE: gemfiles/jobs.gemfile
    steps:
    - uses: actions/checkout@v4
    # Same mise setup as the first job (see its comment).
    - name: Set up Ruby (mise)
      uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      with:
        version: 2026.10.3
        sha256: 8d48bc510b7d844fad0bc7156c0855c2a1e7230c51e498a7f6b63b021f8b57c5
        cache: false
        mise_toml: |
          [tools]
          ruby = "4.0"
    - name: Install gems
      run: bundle install --jobs 4
    - name: Backends load (so their specs run, not skip)
      run: bundle exec ruby -e 'require "active_job"; require "sidekiq"'
    - name: Run the suite
      run: bundle exec rspec

  # The full suite on ActiveRecord 7.1: transactional keeps working and
  # after_commit refuses to declare (it needs 7.2). AR 7.1 is tested on 3.3.
  activerecord-7-1:
    runs-on: [self-hosted, afs-ci]
    name: activerecord 7.1
    env:
      BUNDLE_GEMFILE: gemfiles/activerecord_7_1.gemfile
    steps:
    - uses: actions/checkout@v4
    # Same mise setup as the first job (see its comment).
    - name: Set up Ruby (mise)
      uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      with:
        version: 2026.10.3
        sha256: 8d48bc510b7d844fad0bc7156c0855c2a1e7230c51e498a7f6b63b021f8b57c5
        cache: false
        mise_toml: |
          [tools]
          ruby = "3.3"
    - name: Install gems
      run: bundle install --jobs 4
    - name: ActiveRecord is really below 7.2 (so the legacy spec runs, not skips)
      run: bundle exec ruby -e 'require "active_record"; abort ActiveRecord.version.to_s unless ActiveRecord.gem_version < Gem::Version.new("7.2")'
    - name: Run the suite
      run: bundle exec rspec

  # One stable check name for branch protection: it passes only when every
  # gating job passed, so the required check survives matrix changes.
  ci:
    runs-on: [self-hosted, afs-ci]
    name: ci
    needs: [build, jobs, activerecord-7-1]
    if: always()
    steps:
    - name: Require every job to pass
      run: |
        test "${{ needs.build.result }}" = "success"
        test "${{ needs.jobs.result }}" = "success"
        test "${{ needs.activerecord-7-1.result }}" = "success"
